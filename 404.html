<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050b17" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Señal perdida · Juansi: Operación Presencia</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23081422'/%3E%3Ccircle cx='32' cy='34' r='20' fill='%23a8d8ff'/%3E%3Ccircle cx='25' cy='32' r='5' fill='%230b1728'/%3E%3Ccircle cx='40' cy='32' r='5' fill='%230b1728'/%3E%3Ccircle cx='32' cy='11' r='5' fill='%23a8d8ff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #050b17;
        --panel: rgba(10, 23, 43, 0.95);
        --line: rgba(142, 189, 230, 0.18);
        --text: #eaf7ff;
        --muted: #83a0b8;
        --cyan: #78e9ff;
        --radius: 24px;
        font-family: Inter, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 6px;
        padding: 28px;
        text-align: center;
        background:
          radial-gradient(900px 520px at 78% -10%, rgba(120, 233, 255, 0.16), transparent 62%),
          radial-gradient(760px 460px at 8% 108%, rgba(181, 149, 255, 0.14), transparent 60%),
          var(--bg);
        color: var(--text);
      }
      .hud {
        justify-self: center;
        padding: 22px 26px 26px;
        border-radius: var(--radius);
        border: 1px solid var(--line);
        background: var(--panel);
        box-shadow: 0 20px 70px rgba(0, 0, 0, 0.38);
        max-width: 520px;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        padding: 5px 12px;
        border-radius: 999px;
        border: 1px solid rgba(120, 233, 255, 0.32);
        background: rgba(120, 233, 255, 0.12);
        color: var(--cyan);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 12px var(--cyan);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.25; } }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(22px, 4.4vw, 30px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 auto 20px;
        max-width: 44ch;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        color: var(--cyan);
        word-break: break-all;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 999px;
        border: 1px solid rgba(120, 233, 255, 0.45);
        background: linear-gradient(180deg, rgba(120, 233, 255, 0.28), rgba(120, 233, 255, 0.12));
        color: #eaf7ff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a.button:hover { transform: translateY(-1px); background: rgba(120, 233, 255, 0.3); }
      a.button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="hud">
      <span class="eyebrow">Error 404 · señal perdida</span>
      <h1>Este sector no existe</h1>
      <p>
        Juansi no encontró <code id="missing-path">esta ruta</code> en el mapa. Puede que el
        enlace tenga un error o que el sector haya mutado de sitio.
      </p>
      <a class="button" id="home-link" href="./">↩ Volver a la misión</a>
    </main>

    <script>
      // En GitHub Pages un proyecto vive bajo /<repositorio>/, así que la raíz
      // se deduce en tiempo de ejecución en lugar de quedar fijada en el HTML.
      (function () {
        var segments = window.location.pathname.split("/").filter(Boolean);
        var base = segments.length ? "/" + segments[0] + "/" : "/";
        document.getElementById("home-link").setAttribute("href", base);
        var missing = document.getElementById("missing-path");
        if (missing) missing.textContent = window.location.pathname;
      })();
    </script>
  </body>
</html>
